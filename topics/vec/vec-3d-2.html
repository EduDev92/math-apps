<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- וקטורים (שיעורי מתמטיקה: x, y, z) ----------
const add=(a,b)=>a.map((x,i)=>x+b[i]), sub=(a,b)=>a.map((x,i)=>x-b[i]), mul=(a,k)=>a.map(x=>x*k);
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], len=a=>Math.sqrt(dot(a,a)), unit=a=>mul(a,1/len(a));
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const footPlane=(P,n,d)=>add(P,mul(n,-(dot(n,P)+d)/dot(n,n)));
const footLine=(P,A,u)=>add(A,mul(u,dot(sub(P,A),u)/dot(u,u)));
const meetLP=(A,u,n,d)=>add(A,mul(u,-(dot(n,A)+d)/dot(n,u)));
function closest(A,u,B,v){const w=sub(A,B),a=dot(u,u),b=dot(u,v),c=dot(v,v),d=dot(u,w),e=dot(v,w),D=a*c-b*b;
  const s=(b*e-c*d)/D,t=(a*e-b*d)/D;return [add(A,mul(u,s)),add(B,mul(v,t))];}
const deg=r=>r*180/Math.PI;
const angVec=(a,b)=>deg(Math.acos(dot(a,b)/(len(a)*len(b))));
const N=x=>{const r=Math.round(x*100)/100;return (Object.is(r,-0)?0:r).toString().replace('-','−');};
const P3=p=>'('+p.map(N).join(', ')+')';
const D=d=>N(d)+'°';
// math (x,y,z) -> three: x לכיוון הצופה, y ימינה, z למעלה
const T=p=>new THREE.Vector3(p[1],p[2],p[0]);

// ---------- טקסט: {...} מתמטיקה, [[a#b]] שבר, ~AB~ וקטור עם חץ ----------
function H(s){return s
  .replace(/\[\[([^#\]]+)#([^\]]+)\]\]/g,'<span class="fr"><span>$1</span><span>$2</span></span>')
  .replace(/~([^~]+)~/g,'<span class="vec">$1</span>')
  .replace(/\{([^{}]+)\}/g,'<bdi class="m" dir="ltr">$1</bdi>');}
const L=s=>H(s); // כיתוב בשרטוט

// ---------- השקפים: מודל לכל תרגיל עם גוף/ישרים בחוברת G12-U5-VEC-02 ----------
// id = הקישור מהחוברת: t + מספר התרגיל (#t28 = תרגיל 28; המספור בחוברת רץ מ-1 עד 61 מגרסה 2.0). old = המזהה הישן (#a28 = חלק א תרגיל 28) – קודי QR מודפסים מגרסה 1.2 ממשיכים לעבוד. השיעורים בדיוק כמו בחוברת.
const C={u:'c1',v:'c2',p:'c3',q:'c4',s:'sol',k:'axis'};
const SL=[];
const add_=o=>SL.push(o);
const PARTS={'א':'וקטור אלגברי (6.1)','ב':'מכפלה סקלרית (6.2)','ג':'מצב הדדי בין ישרים (6.3)'};
// עזר: גוף לפי קודקודים ורשימת מקצועות. names: {A:[x,y,z],...}; edges: 'AB BC ...' (′ נכתב כ-1: A1)
function solid(g,V,edges,k='k',o={}){edges.split(' ').forEach(e=>{const [a,b]=e.split('-');g.seg(V[a],V[b],k,{r:o.r||.9,dash:o.dash,sol:o.sol});});}
function labelAll(g,V,k='k',skip=''){Object.keys(V).forEach(n=>{if(skip.split(' ').includes(n))return;g.pt(V[n],k,n.replace('1','′'),{small:1});});}
const BOX_E='A-B B-C C-D D-A A1-B1 B1-C1 C1-D1 D1-A1 A-A1 B-B1 C-C1 D-D1';
function prism8(A,B,D,h){const C=add(B,sub(D,A));const V={A,B,C,D};['A','B','C','D'].forEach(n=>V[n+'1']=add(V[n],h));return V;}
const fr_=(a,b)=>'[['+a+'#'+b+']]';

// ===== חלק א =====
add_({id:'t3',old:'a3',axes:1,part:'א',ex:3,title:'תיבה על הצירים',box:[-.5,4.5,-.5,6.5,-.5,4],
  given:'{D} בראשית, {A}, {C}, {D′} על הצירים. {DA = 3 , DC = 5 , DD′ = 3}.',
  text:['כל שיעור הוא "כמה צעדים" בכיוון כל ציר: {B′} נמצא 3 בכיוון {x}, 5 בכיוון {y} ו-3 למעלה.','וקטור = ראש פחות זנב: {~DB′~ = B′ − D}.'],
  sol:'{~DB′~ = (3, 5, 3)} , {~AC′~ = (−3, 5, 3)} , {V = 3 · 5 · 3 = 45}',
  legend:[['u','{~DB′~}','line'],['v','{~AC′~}','line']],
  build(g){const V=prism8([3,0,0],[3,5,0],[0,0,0],[0,0,3]);solid(g,V,BOX_E);labelAll(g,V);
    g.vec(V.D,sub(V.B1,V.D),'u','',{sol:1});g.vec(V.A,sub(V.C1,V.A),'v','',{sol:1});
    g.pt(V.B1,'s','B′(3, 5, 3)',{sol:1});g.pt(V.C1,'s','C′(0, 5, 3)',{sol:1});}});

add_({id:'t4',old:'a4',axes:1,part:'א',ex:4,title:'קובייה: אלכסונים כווקטורים',noTicks:0,box:[-.5,3,-.5,3,-.5,3],
  given:'נפח הקובייה 8 ⇐ מקצוע 2. {A} בראשית, {D} על ציר {x}, {B} על ציר {y}, {A′} על ציר {z}.',
  text:['ארבעת אלכסוני הקובייה עוברים במרכז {(1, 1, 1)}.','שימו לב לסימנים: {~CA′~} הולך "אחורה" בכיוון {x} ו-{y}.'],
  sol:'{~AC′~ = (2, 2, 2)} , {~CA′~ = (−2, −2, 2)} , {~BD′~ = (2, −2, 2)} , {~DB′~ = (−2, 2, 2)}',
  legend:[['u','{~AC′~}','line'],['v','{~CA′~}','line'],['p','{~BD′~}','line'],['q','{~DB′~}','line']],
  build(g){
    const W={A:[0,0,0],B:[0,2,0],C:[2,2,0],D:[2,0,0]};['A','B','C','D'].forEach(n=>W[n+'1']=add(W[n],[0,0,2]));solid(g,W,BOX_E);labelAll(g,W);
    g.vec(W.A,sub(W.C1,W.A),'u','',{sol:1});g.vec(W.C,sub(W.A1,W.C),'v','',{sol:1});g.vec(W.B,sub(W.D1,W.B),'p','',{sol:1});g.vec(W.D,sub(W.B1,W.D),'q','',{sol:1});}});

add_({id:'t5',old:'a5',axes:1,part:'א',ex:5,title:'פירמידה ישרה – שתי אפשרויות',box:[-.5,3,-.5,2,-4,4],
  given:'בסיס ריבועי {ABCD} ברביע הראשון של {[xy]} , {A(1, 0, 0) , B(2, 0, 0)} , נפח 1.',
  text:['בפירמידה ישרה הקודקוד {S} נמצא בדיוק מעל מרכז הריבוע.','שטח הבסיס 1, ו-{V = [[S · h#3]] = 1} ⇐ {h = 3}. אבל הגובה יכול להיות גם מתחת למישור.'],
  sol:'{S(1.5, 0.5, 3)} או {S(1.5, 0.5, −3)}',
  legend:[['u','הפירמידה','line'],['v','האפשרות השנייה','line']],
  build(g){const A=[1,0,0],B=[2,0,0],C=[2,1,0],D=[1,1,0],M=[1.5,.5,0];[[A,B],[B,C],[C,D],[D,A]].forEach(([a,b])=>g.seg(a,b,'k',{r:1}));
    g.pt(A,'k','A');g.pt(B,'k','B');g.pt(C,'k','C',{sol:0});g.pt(D,'k','D');g.pt(M,'k','',{small:1});
    const S1=[1.5,.5,3],S2=[1.5,.5,-3];[A,B,C,D].forEach(p=>{g.seg(p,S1,'u',{sol:1});g.seg(p,S2,'v',{sol:1,dash:1});});
    g.seg(M,S1,'s',{sol:1,dash:1,label:'h = 3'});g.pt(S1,'u','S(1.5, 0.5, 3)',{sol:1});g.pt(S2,'v','S(1.5, 0.5, −3)',{sol:1});}});

add_({id:'t14',old:'a14',part:'א',ex:14,title:'השלמת מקבילון',box:[1,11,-8,5,0,6],
  given:'{A(3, 2, 4) , B(2, 4, 3) , C(5, 0, 2) , B′(6, −1, 3)} (סעיף א).',
  text:['הבסיס {ABCD} מקבילית ⇐ {D = A + C − B}.','כל המקצועות הצדדיים שווים לווקטור {~BB′~} ⇐ מוסיפים אותו לכל קודקוד בבסיס.','המקבילון הזה “שטוח” מאוד (הנפח שלו רק 4) – סובבו אותו כדי לראות שזה באמת גוף.'],
  sol:'{D(6, −2, 3) , A′(7, −3, 4) , C′(9, −5, 2) , D′(10, −7, 3)}',
  legend:[['u','{~BB′~} – מקצוע צדדי','line']],
  build(g){const V=prism8([3,2,4],[2,4,3],[6,-2,3],[4,-5,0]);
    g.seg(V.A,V.B,'k',{r:1});g.seg(V.B,V.C,'k',{r:1});g.vec(V.B,sub(V.B1,V.B),'u','~BB′~');
    ['A','B','C','B1'].forEach(n=>g.pt(V[n],'k',n.replace('1','′')));
    solid(g,V,'C-D D-A A1-B1 B1-C1 C1-D1 D1-A1 A-A1 C-C1 D-D1','s',{r:.9,sol:1});
    ['D','A1','C1','D1'].forEach(n=>g.pt(V[n],'s',n.replace('1','′'),{sol:1}));
}});

add_({id:'t28',old:'a28',axes:1,part:'א',ex:28,title:'תיבה: הטרפז {BKFE}',box:[-.5,6,-.5,8,-.5,11],
  given:'{D} בראשית, {DA = 5 , DC = 7 , DD′ = 10}. {~CE~ = [[3#5]]~CC′~} , {K} מרכז הפאה {AA′D′D} , {DF : FD′ = 4 : 1}.',
  text:['{E} על המקצוע {CC′}, {F} על המקצוע {DD′}, {K} על הפאה השמאלית (המוסתרת).','סובבו עד שרואים ש-{KF} ו-{BE} באותו כיוון.'],
  sol:'{~KF~ = (−2.5, 0, 3)} , {~BE~ = (−5, 0, 6) = 2~KF~} ⇐ {KF ∥ BE} , {EF} לא מקביל ל-{BK} ⇐ <b>טרפז</b>',
  legend:[['u','{KF}','line'],['v','{BE}','line'],['q','הטרפז','plane']],
  build(g){const V=prism8([5,0,0],[5,7,0],[0,0,0],[0,0,10]);solid(g,V,BOX_E);labelAll(g,V);
    const E=[0,7,6],K=[2.5,0,5],F=[0,0,8];g.pt(E,'p','E');g.pt(K,'p','K');g.pt(F,'p','F');
    g.seg(K,F,'u',{sol:1,r:1.8});g.seg(V.B,E,'v',{sol:1,r:1.8});g.seg(V.B,K,'s',{sol:1,r:1});g.seg(E,F,'s',{sol:1,r:1});
    if(g.show)g.tri([V.B,K,F,E],'q',.25);}});

const PYR={A:[-2,1,0],B:[3,0,1],C:[-1,1,2],D:[0,-3,0]};
function pyr(g){const V=PYR;solid(g,V,'A-B B-C C-A A-D B-D C-D');labelAll(g,V);}

function fitCamera(F){const pts=F.fit,dm=unit(F.dir||[1.25,.8,.42]),[u,w]=basis(dm);
  let c=[0,0,0];{const lo=[1e9,1e9,1e9],hi=[-1e9,-1e9,-1e9];pts.forEach(p=>{for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],p[i]);hi[i]=Math.max(hi[i],p[i]);}});c=mul(add(lo,hi),.5);}
  let su=0,sw=0,sd=0;pts.forEach(p=>{const q=sub(p,c);su=Math.max(su,Math.abs(dot(q,u)));sw=Math.max(sw,Math.abs(dot(q,w)));sd=Math.max(sd,Math.abs(dot(q,dm)));});

// מעבר "יבש" על השקף: אוסף את כל הנקודות של הגוף (כולל הפתרון) כדי לחשב את התיבה החוסמת שלו.
function frame(s){if(s._fr)return s._fr;const P=[],r=(...q)=>q.forEach(p=>P.push(p)),z=()=>{};
  const D={show:true,size:1,R:0,seg:(a,b)=>r(a,b),pt:p=>r(p),vec:(a,v)=>r(a,add(a,v)),tri:q=>r(...q),line:z,plane:z,arc:z,right:z,finish:z};

  const size=Math.max(bb[1]-bb[0],bb[3]-bb[2],bb[5]-bb[4])||1;
  for(let i=0;i<3;i++){const m=(bb[2*i]+bb[2*i+1])/2,h=Math.max((bb[2*i+1]-bb[2*i])/2,size*.08);bb[2*i]=m-h*1.12;bb[2*i+1]=m+h*1.12;}
    const mode=(s.axes||s.keepBox)?'axes':'gizmo';   // צירים מלאים רק כשהגוף "יושב" על הצירים; אחרת – חצי כיוון קטנים
  const view=mode==='axes'?[0,1,2].flatMap(i=>[Math.min(bb[2*i],0),Math.max(bb[2*i+1],0)]):bb;   // במצב צירים – גם הראשית בתמונה
  // הנקודות שהמצלמה צריכה להכיל: הגוף, ובמצב צירים – גם הראשית וקצות הצירים; במצב "חצי כיוון" – גם החצים בפינה

  // כיווני הצירים בפינה (רק כשאין צירים בסצנה): ההיטל של שלושת וקטורי היחידה לפי סיבוב המצלמה
  const gz=document.getElementById('giz');if(!gz.hasAttribute('hidden')){const qi=camera.quaternion.clone().invert();let h2='';
    [['x',[1,0,0]],['y',[0,1,0]],['z',[0,0,1]]].forEach(([nm,e])=>{const p=T(e).applyQuaternion(qi);const X=p.x*24,Y=-p.y*24;
      h2+=`<line x1="0" y1="0" x2="${X.toFixed(1)}" y2="${Y.toFixed(1)}"/><circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="2.2" fill="var(--axis)"/><text x="${(X*1.38).toFixed(1)}" y="${(Y*1.38+5).toFixed(1)}" text-anchor="middle">${nm}</text>`;});
    gz.innerHTML=h2;}
  // פריסת תוויות: כל תווית מנסה כמה מקומות סביב הנקודה ובוחרת את הראשון שלא עולה על תווית קודמת.
  // תוויות הגוף נוצרות לפני תוויות הצירים ולכן מקבלות עדיפות; שנתה שאין לה מקום – מוסתרת.
  const placed=[],hit=(a)=>placed.some(b=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h);
  for(const l of labels){v.copy(l.pos).project(camera);if(v.z>1||v.z<-1){l.el.style.display='none';continue;}
    l.el.style.display='';if(!l.w){l.w=l.el.offsetWidth;l.h=l.el.offsetHeight;}
    const x=(v.x+1)/2*w,y=(1-v.y)/2*h,W=l.w,Hh=l.h,g=5;
    const cand=l.cls==='tk'?[[x-W/2,y-Hh/2]]:l.cls==='ax'?[[x-W/2,y-Hh/2],[x+g,y-Hh/2],[x-W-g,y-Hh/2],[x-W/2,y-Hh-g]]:[[x-W/2,y-Hh-g],[x+g,y-Hh*.9],[x-W-g,y-Hh*.9],[x-W/2,y+g],[x+g,y+g*.4],[x-W-g,y+g*.4],[x-W/2,y-2*Hh-g]];
    let pick=null;for(const [cx,cy] of cand){const r={x:cx,y:cy,w:W,h:Hh};if(!hit(r)){pick=r;break;}}
    if(!pick){if(l.cls==='tk'){l.el.style.display='none';continue;}pick={x:cand[0][0],y:cand[0][1],w:W,h:Hh};}
    placed.push(pick);l.el.style.left=pick.x+'px';l.el.style.top=pick.y+'px';}}
state.i=-1;resize();onHash();loop();
</script>
