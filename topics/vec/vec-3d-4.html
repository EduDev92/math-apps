<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- וקטורים (שיעורי מתמטיקה: x, y, z) ----------
const add=(a,b)=>a.map((x,i)=>x+b[i]), sub=(a,b)=>a.map((x,i)=>x-b[i]), mul=(a,k)=>a.map(x=>x*k);
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], len=a=>Math.sqrt(dot(a,a)), unit=a=>mul(a,1/len(a));
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const footPlane=(P,n,d)=>add(P,mul(n,-(dot(n,P)+d)/dot(n,n)));
const footLine=(P,A,u)=>add(A,mul(u,dot(sub(P,A),u)/dot(u,u)));
const meetLP=(A,u,n,d)=>add(A,mul(u,-(dot(n,A)+d)/dot(n,u)));
function closest(A,u,B,v){const w=sub(A,B),a=dot(u,u),b=dot(u,v),c=dot(v,v),d=dot(u,w),e=dot(v,w),D=a*c-b*b;
  const s=(b*e-c*d)/D,t=(a*e-b*d)/D;return [add(A,mul(u,s)),add(B,mul(v,t))];}
const deg=r=>r*180/Math.PI;
const angVec=(a,b)=>deg(Math.acos(dot(a,b)/(len(a)*len(b))));
const N=x=>{const r=Math.round(x*100)/100;return (Object.is(r,-0)?0:r).toString().replace('-','−');};
const P3=p=>'('+p.map(N).join(', ')+')';
const D=d=>N(d)+'°';
// math (x,y,z) -> three: x לכיוון הצופה, y ימינה, z למעלה
// מנקודה במרחב לסצנה. T0 – המיפוי הרגיל (three: Y למעלה = z).
// במבט "כמו בדף" (TM) הסצנה עצמה מוטלת: q = PIV + ROT(p − PIV) ואז (L₀·q, L₁·q, עומק).
// ROT = הסיבוב שהמשתמש עשה בגרירה, ולכן גם בסיבוב הגוף נשאר בהיטל של הדף (לא "נפחס").
// כל אובייקט בסצנה נרשם ב-UPD ומחושב מחדש כשהסיבוב משתנה – עובי הקווים וגודל הנקודות נשארים אחידים.
let TM=null,SCALEPTS=[],ROTQ=null,PIV=[0,0,0],UPD=[];
// WR – סיבוב העולם לשקף שהבסיס שלו לא אופקי (שדה up: הנורמל של הבסיס יפנה למעלה במסך). הצירים בפינה (giz) מסתובבים איתו.
let WR=null;
function rotTo(n){const a=unit(n),z=[0,0,1],c=dot(a,z),v=cross(a,z),s2=dot(v,v);if(s2<1e-12)return c>0?null:[[1,0,0],[0,-1,0],[0,0,-1]];
  const K=[[0,-v[2],v[1]],[v[2],0,-v[0]],[-v[1],v[0],0]],K2=[0,1,2].map(i=>[0,1,2].map(j=>K[i][0]*K[0][j]+K[i][1]*K[1][j]+K[i][2]*K[2][j])),f=(1-c)/s2;
  return [0,1,2].map(i=>[0,1,2].map(j=>(i===j?1:0)+K[i][j]+K2[i][j]*f));}
const T0=p=>{const q=WR?[dot(WR[0],p),dot(WR[1],p),dot(WR[2],p)]:p;return new THREE.Vector3(q[1],q[2],q[0]);};
const _rv=new THREE.Vector3();
function rotP(p){if(!ROTQ)return p;const c=mv(TM,PIV);_rv.set(p[1]-c[1],p[2]-c[2],p[0]-c[0]).applyQuaternion(ROTQ);return [_rv.z+c[0],_rv.x+c[1],_rv.y+c[2]];}
// TM = מטריצה A (3×3, שורות): מעבירה את הגוף ל"גוף של הדף" (בגוף על הצירים – זהות); אחר כך סיבוב והיטל אלכסוני
const mv=(A,p)=>[dot(A[0],p),dot(A[1],p),dot(A[2],p)];
const T=p=>{if(!TM)return T0(p);const q=rotP(mv(TM,p));return new THREE.Vector3(dot(CAV[0],q),dot(CAV[1],q),dot(CAV[2],q));};
const reproject=()=>UPD.forEach(f=>f());

// ---------- טקסט: {...} מתמטיקה, [[a#b]] שבר, ~AB~ וקטור עם חץ ----------
function H(s){return s
  .replace(/\[\[([^#\]]+)#([^\]]+)\]\]/g,'<span class="fr"><span>$1</span><span>$2</span></span>')
  .replace(/~([^~]+)~/g,'<span class="vec">$1</span>')
  .replace(/\{([^{}]+)\}/g,'<bdi class="m" dir="ltr">$1</bdi>');}
const L=s=>H(s); // כיתוב בשרטוט

// ---------- השקפים: מודל לתרגילים עם גוף, מישור או ישרים בחוברת G12-U5-VEC-04 (חוברת תרגול 3) ----------
// id = הקישור מהחוברת: t + מספר התרגיל (#t87 = תרגיל 87; המספור ממשיך את חוברת 1, כאן 62–106). תרגיל 106 מקשר ל-t69 (אותו מקבילון).
const C={u:'c1',v:'c2',p:'c3',q:'c4',s:'sol',k:'axis'};
const SL=[];
const add_=o=>SL.push(o);
const PARTS={'ו':'שאלות מסכמות מבגרויות (6.6)','ז':'מבחן מסכם (6.7)'};
// עזר: גוף לפי קודקודים ורשימת מקצועות. names: {A:[x,y,z],...}; edges: 'AB BC ...' (′ נכתב כ-1: A1)
function solid(g,V,edges,k='k',o={}){edges.split(' ').forEach(e=>{const [a,b]=e.split('-');g.seg(V[a],V[b],k,{r:o.r||.9,dash:o.dash,sol:o.sol});});}
function labelAll(g,V,k='k',skip=''){Object.keys(V).forEach(n=>{if(skip.split(' ').includes(n))return;g.pt(V[n],k,n.replace('1','′'),{small:1});});}
const BOX_E='A-B B-C C-D D-A A1-B1 B1-C1 C1-D1 D1-A1 A-A1 B-B1 C-C1 D-D1';
function prism8(A,B,D,h){const C=add(B,sub(D,A));const V={A,B,C,D};['A','B','C','D'].forEach(n=>V[n+'1']=add(V[n],h));return V;}
const fr_=(a,b)=>'[['+a+'#'+b+']]';

// ===== חלק ו – שאלות מסכמות מבגרויות (6.6) =====
const R3=Math.sqrt(3),R2=Math.sqrt(2);
function circle(g,O,n,r,k,o={}){const a=unit(cross(n,Math.abs(n[0])<.9?[1,0,0]:[0,1,0])),b=unit(cross(n,a));let p=null;
  for(let i=0;i<=64;i++){const t=i/64*2*Math.PI,q=add(O,add(mul(a,r*Math.cos(t)),mul(b,r*Math.sin(t))));if(p)g.seg(p,q,k,{r:o.r||.9,sol:o.sol});p=q;}}

add_({id:'t107',keepBox:1,part:'ו',ex:107,title:'ישר מקביל למישור, אנך וישר קרוב ביותר',box:[-8,4,-9,3,-3,7],
  given:'{ℓ₁} דרך {A(−6, −7, 3) , B(−4, −7, 6)} ; {π: 3x + 4y + mz − 6 = 0}.',
  text:['{ℓ₁ ∥ π} ⟺ וקטור הכיוון {(2, 0, 3)} ניצב לנורמל {(3, 4, m)} ⇐ {6 + 3m = 0}.','{ℓ₂} – בכיוון הנורמל, מ-{A} עד המישור.','הישר הקרוב ביותר ל-{ℓ₁} במישור – ההיטל של {ℓ₁}: דרך {C} ובכיוון של {ℓ₁}.'],
  sol:'{m = −2} , {C(0, 1, −1)} , {ℓ₃: x̲ = (0, 1, −1) + t(2, 0, 3)} , המרחק {AC = 2√29 ≈ 10.77}.',
  legend:[['q','π','plane'],['u','ℓ₁','line'],['s','ℓ₂ (האנך)','line'],['v','ℓ₃','line']],
  build(g){const A=[-6,-7,3],u=[2,0,3],n=[3,4,-2],C=[0,1,-1];g.plane(n,-6,'q',{op:.18});g.line(A,u,'u',{r:1.4});g.pt(A,'u','A');g.pt([-4,-7,6],'u','B',{small:1});
    g.seg(A,C,'s',{sol:1,r:1.6});g.pt(C,'s','C',{sol:1});g.right(C,sub(A,C),u,'s',{sol:1});g.line(C,u,'v',{sol:1,r:1.4});}});

add_({id:'t108',keepBox:1,part:'ו',ex:108,title:'עקב אנך מהראשית ומישורים מקבילים',box:[-3,5,-8,4,-1,8],
  given:'{ℓ: x̲ = (−1, 0, 5) + t(−2, 2, 3)} ; {A} – עקב האנך מ-{O} ; {~OA~ = [[1#2]]~AB~}.',
  text:['{A} – נקודה כללית על הישר, ו-{~OA~ · (−2, 2, 3) = 0}.','{~AB~ = 2~OA~} ⇐ {B = 3A}.','שני המישורים מאונכים ל-{OA}: הנורמל של שניהם הוא {~OA~}, ולכן המרחק ביניהם הוא {AB}.'],
  sol:'{A(1, −2, 2) , B(3, −6, 6)} ; {π₁: x − 2y + 2z − 9 = 0} , {π₂: x − 2y + 2z − 27 = 0} ; המרחק {6}.',
  legend:[['u','ℓ','line'],['s','O, A, B','line'],['q','π₁','plane'],['p','π₂','plane']],
  build(g){const A=[1,-2,2],B=[3,-6,6];g.line([-1,0,5],[-2,2,3],'u',{r:1.3});g.seg([0,0,0],B,'s',{r:1.5});g.pt([0,0,0],'k','O',{small:1});g.pt(A,'s','A');g.pt(B,'s','B');
    g.right(A,[-2,2,3],mul(A,-1),'s');g.plane([1,-2,2],-9,'q',{op:.16,sol:1});g.plane([1,-2,2],-27,'p',{op:.16,sol:1});}});

add_({id:'t111',axes:1,part:'ו',ex:111,title:'פירמידה {AOBC} על הצירים',box:[-.5,4,-5,5,-.5,13],
  given:'{A(3, 0, 0)} , {C(0, 0, 12)} , {B} במישור {[xy]} , {BO = 5} , {~AC~ · ~AB~ = 0}.',
  text:['{~AC~ · ~AB~ = −3(x − 3) = 0} ⇐ {x = 3}, ומ-{BO = 5}: {B(3, 4, 0)} – {AB} מקביל לציר ה-{y}.','המישור {CAB} חותך את {[xy]} בישר {AB}; {D} על הישר הזה ו-{CD = CB}.'],
  sol:'{CAB: 4x + z − 12 = 0} ; הזווית עם {[yz]}: {14.04°} ; {D(3, −4, 0)} ; הזווית בין {CD} ל-{[yz]}: {13.34°}.',
  legend:[['q','המשולש CAB','plane'],['s','CD','line']],
  build(g){const O=[0,0,0],A=[3,0,0],B=[3,4,0],C=[0,0,12],D=[3,-4,0];solid(g,{O,A,B,C},'O-A O-B O-C A-B B-C C-A');labelAll(g,{O,A,B,C});

  G.right=(V,a,b,k,o={})=>{if(!ok(o))return;const s=size*.04,A=mul(unit(a),s),Bv=sub(b,mul(unit(a),dot(b,unit(a))));const B=mul(unit(Bv),s);
    G.seg(add(V,A),add(add(V,A),B),k,{r:.9});G.seg(add(V,B),add(add(V,A),B),k,{r:.9});};
  // צירים ורשת – נבנים אחרי הגוף (G.finish), כדי שהתוויות של הגוף יקבלו עדיפות בפריסה.
  G.finish=()=>{
  if(mode==='gizmo')return;   // הגוף רחוק מהראשית: בלי צירים ורשת – כיווני הצירים מוצגים בפינת המסך (giz)
  const gm=new THREE.LineBasicMaterial({color:col('grid')}),gp=[];const st=niceStep(Math.max(sx,sy)/8);
  for(let x=Math.ceil(box[0]/st)*st;x<=box[1]+1e-9;x+=st)gp.push([x,box[2],0],[x,box[3],0]);
  for(let y=Math.ceil(box[2]/st)*st;y<=box[3]+1e-9;y+=st)gp.push([box[0],y,0],[box[1],y,0]);
  {const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(gp.length*3),3));
   const f=()=>{const a=geo.attributes.position;gp.forEach((p,i)=>{const v=T(p);a.setXYZ(i,v.x,v.y,v.z);});a.needsUpdate=true;geo.computeBoundingSphere();};f();UPD.push(f);
   root.add(new THREE.LineSegments(geo,gm));}
  ['x','y','z'].forEach((nm,i)=>{const e=[0,0,0];e[i]=1;const lo=Math.min(box[2*i],0),hi=Math.max(box[2*i+1],0)+size*.1;
    G.seg(mul(e,lo),mul(e,hi-size*.04),'k',{r:.8});stretch(new THREE.Mesh(new THREE.ConeGeometry(R*3,1,16),mat('k')),mul(e,hi-size*.045),mul(e,hi));
    lab(mul(e,hi+size*.07),nm,'k','ax');if(noTicks)return;const s2=niceStep((hi-lo)/5);
    for(let v=Math.ceil(lo/s2)*s2;v<hi-size*.06;v+=s2){if(Math.abs(v)<1e-9)continue;const p=mul(e,v);
      const off=i===2?[0,-size*.03,0]:[0,0,-size*.03];lab(add(p,off),N(v),'k','tk');}});
  };
  return G;}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*p;}

function fitCamera(F,d0){const pts=F.fit,dm=unit(d0||F.dir||[1.25,.8,.42]),[u,w]=basis(dm);
  let c=[0,0,0];{const lo=[1e9,1e9,1e9],hi=[-1e9,-1e9,-1e9];pts.forEach(p=>{for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],p[i]);hi[i]=Math.max(hi[i],p[i]);}});c=mul(add(lo,hi),.5);}
  let su=0,sw=0,sd=0;pts.forEach(p=>{const q=sub(p,c);su=Math.max(su,Math.abs(dot(q,u)));sw=Math.max(sw,Math.abs(dot(q,w)));sd=Math.max(sd,Math.abs(dot(q,dm)));});
  const vf=camera.fov*Math.PI/180,hf=2*Math.atan(Math.tan(vf/2)*camera.aspect);
  const dist=(Math.max(su/Math.tan(hf/2),sw/Math.tan(vf/2))+sd)*1.1,size=Math.max(su,sw,sd)*2||1;
  const tgt=T0(c);controls.target.copy(tgt);camera.position.copy(tgt.clone().add(T0(dm).multiplyScalar(dist)));
  camera.near=size*.01;camera.far=size*60;camera.updateProjectionMatrix();controls.update();}


// מעבר "יבש" על השקף: אוסף את כל הנקודות של הגוף (כולל הפתרון) כדי לחשב את התיבה החוסמת שלו.
function frame(s){if(s._fr)return s._fr;const P=[],r=(...q)=>q.forEach(p=>P.push(p)),z=()=>{};
  const NP={},D={show:true,size:1,R:0,seg:(a,b)=>r(a,b),pt:(p,k,t)=>{r(p);if(t)NP[t]=p;},vec:(a,v)=>r(a,add(a,v)),tri:q=>r(...q),line:z,plane:z,arc:z,right:z,finish:z};
  s.build(D,s.param?s.param.init:null);
  let bb;if(s.keepBox||!P.length)bb=s.box.slice();else{bb=[1e9,-1e9,1e9,-1e9,1e9,-1e9];P.forEach(p=>{for(let i=0;i<3;i++){bb[2*i]=Math.min(bb[2*i],p[i]);bb[2*i+1]=Math.max(bb[2*i+1],p[i]);}});}
  const size=Math.max(bb[1]-bb[0],bb[3]-bb[2],bb[5]-bb[4])||1;
  for(let i=0;i<3;i++){const m=(bb[2*i]+bb[2*i+1])/2,h=Math.max((bb[2*i+1]-bb[2*i])/2,size*.08);bb[2*i]=m-h*1.12;bb[2*i+1]=m+h*1.12;}
    const mode=(s.axes||s.keepBox)?'axes':'gizmo';   // צירים מלאים רק כשהגוף "יושב" על הצירים; אחרת – חצי כיוון קטנים
  const view=mode==='axes'?[0,1,2].flatMap(i=>[Math.min(bb[2*i],0),Math.max(bb[2*i+1],0)]):bb;   // במצב צירים – גם הראשית בתמונה
  // הנקודות שהמצלמה צריכה להכיל: הגוף, ובמצב צירים – גם הראשית וקצות הצירים; במצב "חצי כיוון" – גם החצים בפינה
  const fit=P.slice();const sz=Math.max(view[1]-view[0],view[3]-view[2],view[5]-view[4]);
  if(mode==='axes'){fit.push([0,0,0]);[0,1,2].forEach(i=>{const e=[0,0,0];e[i]=Math.max(view[2*i+1],0)+sz*.17;fit.push(e);});}
  if(s.keepBox)for(let i=0;i<8;i++)fit.push([s.box[i&1],s.box[2+((i>>1)&1)],s.box[4+((i>>2)&1)]]);
  // כיוון מבט: במצב צירים – כמו בשרטוט בחוברת (x כלפי הצופה). אחרת – הכיוון שבו הגוף נראה "רחב" ביותר
  // (שטח המלבן החוסם של ההיטל מקסימלי), עם העדפה קלה לכיוון הרגיל, כדי שלא יתקבל גוף "שטוח" שהמימד הארוך שלו מכוון אל הצופה.
  let dir=s.view||null;
  if(!dir&&mode!=='axes'&&P.length>3){const az0=32.6;let best=-1;
    for(let az=0;az<360;az+=15)for(const el of [18,30,42]){const a=az*Math.PI/180,e=el*Math.PI/180,d=[Math.cos(e)*Math.cos(a),Math.cos(e)*Math.sin(a),Math.sin(e)];
      const [u,w]=basis(d);let u0=1e9,u1=-1e9,w0=1e9,w1=-1e9;P.forEach(p=>{const pu=dot(p,u),pw=dot(p,w);u0=Math.min(u0,pu);u1=Math.max(u1,pu);w0=Math.min(w0,pw);w1=Math.max(w1,pw);});
      const da=Math.abs(((az-az0+540)%360)-180),sc=(u1-u0)*(w1-w0)*(1-.18*da/180)*(1-.1*Math.abs(el-30)/30);if(sc>best){best=sc;dir=d;}}}
  // מפת ההיטל "כמו בדף": מותאמת לשרטוט הסכמטי (page), או ההיטל האלכסוני לגוף שעל הצירים
  let map=null;if(s.page){const ks=Object.keys(s.page).filter(k=>NP[k]);const E=ks.slice(1,4).map(k=>sub(NP[k],NP[ks[0]]));map={A:niceA(fitMap(ks.map(k=>NP[k]),ks.map(k=>s.page[k])).L,E),fit:1};}else if(mode==='axes')map=OBL;
  return s._fr={bb,mode,view,fit,dir,map};}
function basis(d){const n=unit(d),up=WR?WR[2]:[0,0,1],u=unit(cross(up,n)),w=cross(n,u);return [u,w];}   // up – הכיוון שמופיע למעלה במסך (עם WR: ה-up של השקף)
function build(keepCam){
  const s=SL[state.i];scene.remove(root);root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});
  WR=s.up?rotTo(s.up):null;   // לפני fitCamera – המצלמה ממוקמת בעולם המסובב
  if(!keepCam){setPage(true);fitCamera(frame(s));}   // שקף חדש / איפוס: "כמו בדף" כשיש לשקף שרטוט בחוברת; המצלמה (לתלת-ממד) – במבט הרגיל של השקף
  {const F0=frame(s);TM=pageMode&&F0.map?F0.map.A:null;SCALEPTS=F0.fit;if(!keepCam&&TM)pageStart();if(!TM)ROTQ=null;}
  UPD=[];
  root=new THREE.Group();scene.add(root);labelsEl.innerHTML='';labels=[];
  scene.background=new THREE.Color(css('stage'));
  const F=frame(s);const box=s.keepBox?s.box:F.view;
  const g=makeG(box,state.sol,s.noTicks,F.mode);s.build(g,state.par);g.finish();
  {const gz=document.getElementById('giz');if(F.mode==='gizmo')gz.removeAttribute('hidden');else gz.setAttribute('hidden','');}
  if(!keepCam&&pageMode)pageFit(F);}

function panel(){
  const s=SL[state.i],el=document.getElementById('panel');
  const lg=(s.legend||[]).map(([k,t,ty])=>`<span><i class="${ty==='plane'?'pl':ty==='dot'?'dot':''}" style="background:var(--${C[k]||k})"></i>${H(t)}</span>`).join('');
  el.innerHTML=`<div class="eyebrow">${s.part==='מ'?'מושג בסיסי – להסבר על הלוח':`חלק ${s.part} · ${PARTS[s.part]} · תרגיל ${s.ex}`}</div>
   <h2>${H(s.title)}</h2>
   <div class="blk"><h3>נתון</h3><p>${H(s.given)}</p></div>
   <div class="blk"><h3>מה רואים במודל</h3><ul>${s.text.map(t=>`<li>${H(t)}</li>`).join('')}</ul></div>
   <div class="legend">${lg}</div>
   <div class="blk sol" ${state.sol?'':'hidden'}><h3>פתרון</h3><p>${H(s.sol)}</p></div>`;
  document.getElementById('count').textContent=(state.i+1)+' / '+SL.length;
  document.getElementById('jump').value=state.i;
  const sb=document.getElementById('sliderbox'),par=document.getElementById('par');
  if(s.param){sb.hidden=false;document.getElementById('parlab').textContent=s.param.name;Object.assign(par,{min:s.param.min,max:s.param.max,step:s.param.step});par.value=state.par;
    document.getElementById('parout').textContent=s.param.name+' = '+N(state.par);}else sb.hidden=true;
  const b=document.getElementById('solbtn');b.setAttribute('aria-pressed',state.sol);b.textContent=state.sol?'הסתר פתרון':'הצג פתרון';}

function go(i){state.i=(i+SL.length)%SL.length;state.sol=false;const s=SL[state.i];state.par=s.param?s.param.init:null;
  panel();build(false);try{history.replaceState(null,'','#'+s.id);}catch(e){}}

// בחירת שקף
const jump=document.getElementById('jump');
SL.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(s.part==='מ'?'מושג':`חלק ${s.part}, תרגיל ${s.ex}`)+` – ${s.title.replace(/[{}]/g,'')}`;jump.appendChild(o);});
jump.onchange=()=>go(+jump.value);
document.getElementById('next').onclick=()=>go(state.i+1);
document.getElementById('prev').onclick=()=>go(state.i-1);
document.getElementById('solbtn').onclick=()=>{state.sol=!state.sol;panel();build(true);};
document.getElementById('reset').onclick=viewReset;
// לתלת-ממד אמיתי מאותו כיוון מבט; ובחזרה – ההיטל של השרטוט מהכיוון הנוכחי של המצלמה (הגוף חוזר בדיוק לשרטוט)
document.getElementById('page').onclick=()=>{if(pageMode){setPage(false);build(true);}else{setPage(true);pageStart();build(true);pageFit(frame(SL[state.i]));}};
const rot=document.getElementById('rot');rot.onclick=()=>{controls.autoRotate=!controls.autoRotate;controls.autoRotateSpeed=1.4;rot.setAttribute('aria-pressed',controls.autoRotate);};
document.getElementById('fs').onclick=()=>{const d=document.documentElement;try{(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen()).catch(()=>{});}catch(e){}};
document.getElementById('par').oninput=e=>{state.par=+e.target.value;document.getElementById('parout').textContent=SL[state.i].param.name+' = '+N(state.par);build(true);};
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key==='ArrowLeft'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(state.i+1);}
  else if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();go(state.i-1);}
  else if(e.key==='s'||e.key==='ס'){document.getElementById('solbtn').click();}});
function onHash(){const h=decodeURIComponent(location.hash.slice(1));let i=SL.findIndex(x=>x.id===h||x.old===h);if(i<0)i=0;if(i!==state.i||!labels.length)go(i);}
window.addEventListener('hashchange',onHash);
// ערכת צבעים
const reTheme=()=>{panel();build(true);};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',reTheme);}catch(e){}
new MutationObserver(reTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();pageProj();}
new ResizeObserver(resize).observe(stage);
const v=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);controls.update();pageTick();renderer.render(scene,cam());
  const w=stage.clientWidth,h=stage.clientHeight;
  // כיווני הצירים בפינה (רק כשאין צירים בסצנה): ההיטל של שלושת וקטורי היחידה לפי סיבוב המצלמה
  const gz=document.getElementById('giz');if(!gz.hasAttribute('hidden')){const qi=camera.quaternion.clone().invert();let h2='';
    [['x',[1,0,0]],['y',[0,1,0]],['z',[0,0,1]]].forEach(([nm,e])=>{let X,Y;if(pageMode&&TM){const o=T(PIV),D=[[1,0,0],[0,1,0],[0,0,1]].map(q=>T(add(PIV,q)).sub(o)),k=Math.max(...D.map(d=>Math.hypot(d.x,d.y)))||1,d=T(add(PIV,e)).sub(o);X=d.x/k*24;Y=-d.y/k*24;}else{const p=T(e).applyQuaternion(qi);X=p.x*24;Y=-p.y*24;}
      h2+=`<line x1="0" y1="0" x2="${X.toFixed(1)}" y2="${Y.toFixed(1)}"/><circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="2.2" fill="var(--axis)"/><text x="${(X*1.38).toFixed(1)}" y="${(Y*1.38+5).toFixed(1)}" text-anchor="middle">${nm}</text>`;});
    gz.innerHTML=h2;}
  // פריסת תוויות: כל תווית מנסה כמה מקומות סביב הנקודה ובוחרת את הראשון שלא עולה על תווית קודמת.
  // תוויות הגוף נוצרות לפני תוויות הצירים ולכן מקבלות עדיפות; שנתה שאין לה מקום – מוסתרת.
  const placed=[],hit=(a)=>placed.some(b=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h);
  const C_=cam();for(const l of labels){v.copy(l.pos).project(C_);if(v.z>1||v.z<-1){l.el.style.display='none';continue;}
    l.el.style.display='';if(!l.w){l.w=l.el.offsetWidth;l.h=l.el.offsetHeight;}
    const x=(v.x+1)/2*w,y=(1-v.y)/2*h,W=l.w,Hh=l.h,g=5;
    const cand=l.cls==='tk'?[[x-W/2,y-Hh/2]]:l.cls==='ax'?[[x-W/2,y-Hh/2],[x+g,y-Hh/2],[x-W-g,y-Hh/2],[x-W/2,y-Hh-g]]:[[x-W/2,y-Hh-g],[x+g,y-Hh*.9],[x-W-g,y-Hh*.9],[x-W/2,y+g],[x+g,y+g*.4],[x-W-g,y+g*.4],[x-W/2,y-2*Hh-g]];
    let pick=null;for(const [cx,cy] of cand){const r={x:cx,y:cy,w:W,h:Hh};if(!hit(r)){pick=r;break;}}
    if(!pick){if(l.cls==='tk'){l.el.style.display='none';continue;}pick={x:cand[0][0],y:cand[0][1],w:W,h:Hh};}
    placed.push(pick);l.el.style.left=pick.x+'px';l.el.style.top=pick.y+'px';}}
state.i=-1;resize();onHash();loop();
</script>
